# The site is published from the folder below; the functions live in
# netlify/functions and declare their own URLs:
#
#   store.mjs  ->  /api/playlist 
#   ping.mjs   ->  /api/ping
#
# Do NOT add a redirect for /api/playlist here. A forced redirect shadows the
# function's own route, and if it points at a filename that no longer exists
# you get a 404 that looks like a missing function.

[build]
  publish = "public"
  functions = "netlify/functions"
