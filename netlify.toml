# The site is published straight from the repo root, so index.html can sit
# right next to this file. The function is picked up from netlify/functions
# and answers at /api/playlist.

[build]
  publish = "."
  functions = "netlify/functions"

# Belt and braces: the function declares this route itself, and this redirect
# guarantees it even if that route config is ignored.
[[redirects]]
  from = "/api/playlist"
  to = "/.netlify/functions/playlist"
  status = 200
  force = true
